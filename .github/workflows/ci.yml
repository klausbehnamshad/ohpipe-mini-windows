name: Windows-Prüfung (Programmlogik, ohne Modelle)

# Windows Server 2025 x64: Programmlogik, Paketstruktur und Embed-Installation.
# Die Prüfung für Windows 11 Home 24H2 und echte Modellläufe erfolgt separat.
on:
  push:
  pull_request:

jobs:
  logik:
    runs-on: windows-2025
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Frische Python-Umgebung einrichten
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "ohpipe-ci"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $venv "Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Python, pip und Architektur prüfen
        shell: pwsh
        run: |
          python -c "import site, sys, sysconfig; print(sys.version); print(sysconfig.get_platform()); assert sys.version_info[:3] == (3, 12, 10); assert sysconfig.get_platform() == 'win-amd64'; assert sys.prefix != sys.base_prefix and site.ENABLE_USER_SITE is False"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip --version
      - name: Testvoraussetzungen einrichten (Hash-Lock wie im Setup)
        run: python -m pip install --require-hashes -r app/requirements.lock
      - name: Installierte Abhängigkeiten prüfen
        run: python -m pip check
      - name: Imports prüfen
        run: python -c "import faster_whisper, pyannote.audio, torch; print('Imports ok:', torch.__version__)"
      - name: FFmpeg und FFprobe aus dem Paket-Setup prüfen
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          . "$root\scripts\common.ps1"
          $cfg = Get-ModelsConfig -Root $root
          Install-FFmpeg -Root $root -Cfg $cfg
          $expected = [regex]::Escape($cfg.ffmpeg.version)
          foreach ($tool in @("ffmpeg", "ffprobe")) {
            $exe = Join-Path $root "runtime\ffmpeg\bin\$tool.exe"
            $output = & $exe -version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = $output | Select-Object -First 1
            if ($version -notmatch "^$tool version $expected(?:\W|$)") {
              throw "Unerwartete Version: $version"
            }
            Write-Host $version
          }
      - name: Synthetische Programmlogik prüfen
        run: python -m pytest tests/ -q

  paketstruktur:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Paketstruktur prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("app/ohpipe.py","app/diar_adapter.py","app/diar2_merge.py",
                           "app/models.json","app/requirements.lock","bin/oh-kette.cmd",
                           "scripts/Install.ps1","scripts/common.ps1",
                           "scripts/Setup-Modelle.py","tests/data/sprachclip.wav",
                           "START-HIER.txt","README.md","LICENSE")) {
            if (!(Test-Path $f)) { throw "fehlt: $f" }
          }
          $lock = (Select-String -Path app/requirements.lock -Pattern "^    --hash").Count
          Write-Host "Lock-Einträge: $lock"
          if ($lock -lt 90) { throw "Lock unvollständig ($lock Einträge)" }
      - name: PowerShell-Skripte parsen (alle .ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dateien = Get-ChildItem -Recurse -Include *.ps1 scripts,bin
          if ($dateien.Count -eq 0) { throw "keine .ps1 gefunden" }
          foreach ($f in $dateien) {
            $fehler = $null
            [void][System.Management.Automation.PSParser]::Tokenize(
              (Get-Content $f.FullName -Raw), [ref]$fehler)
            if ($fehler.Count -gt 0) { throw "Syntaxfehler in $($f.FullName)" }
          }
          # Gefährliches Muster: $Variable: in expandierbaren Strings
          # (Doppelpunkt als Scope). Erlaubt bleibt $env: (Bereich).
          $funde = Select-String -Path scripts/*.ps1,bin/*.ps1 `
            -Pattern '"[^"]*\$(?!env:)[A-Za-z_][A-Za-z0-9_]*:' -AllMatches
          if ($funde) { $funde | ForEach-Object { Write-Host $_ }; throw "nicht abgegrenzte Variable vor Doppelpunkt" }
          Write-Host "Parser ok ($($dateien.Count) Dateien)."
      - name: Startskripte (.cmd) prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in Get-ChildItem bin/*.cmd) {
            $inhalt = Get-Content $f.FullName -Raw
            if ($inhalt -notmatch "runtime\\python\\python\.exe") {
              throw "$($f.Name) ruft nicht das private Python auf"
            }
          }
          Write-Host ".cmd ok."

  paketinstallation:
    runs-on: windows-2025
    env:
      HF_HUB_OFFLINE: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Paket bauen, SHA-256 prüfen und entpacken
        run: |
          $version = (Get-Content -LiteralPath "$env:GITHUB_WORKSPACE\VERSION" -Raw).Trim()
          $packageName = "ohpipe-mini-windows-$version"
          $artifacts = Join-Path $env:RUNNER_TEMP "ohpipe-artifacts"
          python "$env:GITHUB_WORKSPACE\scripts\build_paket.py" --ablage $artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $artifacts "$packageName.zip"
          $checksum, $archiveName = (Get-Content -LiteralPath "$archive.sha256" -Raw).Trim() -split "\s+", 2
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($checksum -ne $actual -or $archiveName -cne "$packageName.zip") {
            throw "SHA-256-Datei stimmt nicht mit dem Paket überein."
          }
          Write-Host "Paket SHA-256: $actual"
          $destination = Join-Path $env:RUNNER_TEMP "ohpipe-extracted"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "OHPIPE_CI_PACKAGE=$(Join-Path $destination $packageName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Privates Python und gehashte Pakete installieren
        run: |
          $root = $env:OHPIPE_CI_PACKAGE
          . "$root\scripts\common.ps1"
          $cfg = Get-ModelsConfig -Root $root
          Install-PythonEmbed -Root $root -Cfg $cfg
          Install-PythonPakete -Root $root
          $python = Join-Path $root "runtime\python\python.exe"
          & $python -c "import sys, sysconfig; print(sys.version); print(sysconfig.get_platform()); assert sys.version_info[:3] == (3, 12, 10); assert sysconfig.get_platform() == 'win-amd64'; assert sys.flags.isolated"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
